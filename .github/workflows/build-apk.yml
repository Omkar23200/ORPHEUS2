name: Build ORPHEUS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OrpheusUniversal_v0.8_Exact_ORPHEUS_Symbol.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract ORPHEUS
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q "OrpheusUniversal_v0.8_Exact_ORPHEUS_Symbol.zip" -d build-src
          test -f build-src/jarvis/JarvisMVP/settings.gradle.kts

      - name: Upgrade ORPHEUS UI to v0.9
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("build-src/jarvis/JarvisMVP")
          p = root / "app/src/main/java/com/omkar/jarvis/MainActivity.kt"
          s = p.read_text()

          # Required Compose import
          if "import androidx.activity.compose.setContent" not in s:
              s = s.replace(
                  "import androidx.activity.ComponentActivity",
                  "import androidx.activity.ComponentActivity\n"
                  "import androidx.activity.compose.setContent"
              )

          # Fix the three Regex parsing calls
          s = s.replace(
              'clean.substringAfter(Regex("(?i)check grammar|correct grammar|fix grammar"), "").trim()',
              'clean.replaceFirst(Regex("(?i)^(check grammar|correct grammar|fix grammar)\\\\s*"), "").trim()'
          )

          s = s.replace(
              'clean.substringAfter(Regex("(?i)advice|advise"), "").trim()',
              'clean.replaceFirst(Regex("(?i)^(advice|advise)\\\\s*"), "").trim()'
          )

          s = s.replace(
              'clean.substringAfter(Regex("(?i)send message|message|sms"), "").trim()',
              'clean.replaceFirst(Regex("(?i)^(send message|message|sms)\\\\s*"), "").trim()'
          )

          # Remove the invalid top-level preference functions
          marker = "/** Local response preferences used by the ORPHEUS UI. */"
          if marker in s:
              s = s.split(marker)[0].rstrip() + "\n"

          # Replace the cramped settings row with a responsive card.
          old = '''                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                        TextButton(onClick = { showSettings = true }) { Text("Privacy & Settings") }
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Text("Discovery")
                            Switch(checked = discoveryEnabled, onCheckedChange = { discoveryEnabled = it })
                        }
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Text("Popups")
                            Switch(
                                checked = smartPopups,
                                onCheckedChange = {
                                    smartPopups = it
                                    if (!it) smartNote = null
                                    prefs.edit().putBoolean(SMART_POPUPS_KEY, it).apply()
                                }
                            )
                        }
                    }
                    Spacer(Modifier.height(4.dp))'''

          new = '''                    Card(
                        modifier = Modifier.fillMaxWidth(),
                        colors = CardDefaults.cardColors(
                            containerColor = Color(0xFF101621)
                        ),
                        shape = RoundedCornerShape(18.dp)
                    ) {
                        Column(Modifier.padding(8.dp)) {
                            Row(
                                Modifier.fillMaxWidth(),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                TextButton(
                                    onClick = { showSettings = true },
                                    modifier = Modifier.weight(1f)
                                ) {
                                    Text("PRIVACY & SETTINGS")
                                }

                                Text(
                                    "ORPHEUS SYSTEM",
                                    style = MaterialTheme.typography.labelSmall
                                )
                            }

                            Row(
                                Modifier.fillMaxWidth(),
                                horizontalArrangement = Arrangement.spacedBy(8.dp)
                            ) {
                                OutlinedButton(
                                    onClick = {
                                        discoveryEnabled = !discoveryEnabled
                                    },
                                    modifier = Modifier.weight(1f)
                                ) {
                                    Text(
                                        if (discoveryEnabled)
                                            "Discovery ON"
                                        else
                                            "Discovery OFF",
                                        maxLines = 1
                                    )
                                }

                                OutlinedButton(
                                    onClick = {
                                        smartPopups = !smartPopups
                                        if (!smartPopups) smartNote = null
                                        prefs.edit()
                                            .putBoolean(
                                                SMART_POPUPS_KEY,
                                                smartPopups
                                            )
                                            .apply()
                                    },
                                    modifier = Modifier.weight(1f)
                                ) {
                                    Text(
                                        if (smartPopups)
                                            "Popups ON"
                                        else
                                            "Popups OFF",
                                        maxLines = 1
                                    )
                                }
                            }
                        }
                    }

                    Spacer(Modifier.height(8.dp))'''

          if old in s:
              s = s.replace(old, new, 1)

          # Add a futuristic ORPHEUS CORE card before the assistant result.
          anchor = "                    if (assistResult != null) {"

          core = '''                    Card(
                        modifier = Modifier.fillMaxWidth(),
                        colors = CardDefaults.cardColors(
                            containerColor = Color(0xFF0D1320)
                        ),
                        shape = RoundedCornerShape(22.dp)
                    ) {
                        Row(
                            Modifier
                                .fillMaxWidth()
                                .padding(14.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Image(
                                painter = painterResource(R.drawable.orpheus_logo),
                                contentDescription = "ORPHEUS",
                                modifier = Modifier.size(78.dp),
                                contentScale = ContentScale.Fit
                            )

                            Spacer(Modifier.width(14.dp))

                            Column(Modifier.weight(1f)) {
                                Text(
                                    "ORPHEUS CORE",
                                    style = MaterialTheme.typography.titleMedium
                                )

                                Text(
                                    if (listening)
                                        "● LISTENING"
                                    else
                                        "● READY FOR COMMAND",
                                    style = MaterialTheme.typography.labelMedium
                                )

                                Spacer(Modifier.height(3.dp))

                                Text(
                                    "LOCAL-FIRST  •  PRIVATE  •  READY",
                                    style = MaterialTheme.typography.bodySmall
                                )
                            }
                        }
                    }

                    Spacer(Modifier.height(8.dp))

'''

          if anchor in s and "ORPHEUS CORE" not in s:
              s = s.replace(anchor, core + anchor, 1)

          p.write_text(s)

          # Dark futuristic system theme.
          styles = root / "app/src/main/res/values/styles.xml"

          styles.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Orpheus" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#070A10</item>
                  <item name="android:navigationBarColor">#070A10</item>
              </style>
          </resources>
          ''')

          print("ORPHEUS v0.9 UI patch complete.")
          PY

      - name: Build ORPHEUS v0.9
        working-directory: build-src/jarvis/JarvisMVP
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORPHEUS-v0.9-APK
          path: build-src/jarvis/JarvisMVP/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
