name: Build ORPHEUS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OrpheusUniversal_v0.8_Exact_ORPHEUS_Symbol.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract ORPHEUS
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q "OrpheusUniversal_v0.8_Exact_ORPHEUS_Symbol.zip" -d build-src
          test -f build-src/jarvis/JarvisMVP/settings.gradle.kts

      - name: Build ORPHEUS APK
        working-directory: build-src/jarvis/JarvisMVP
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORPHEUS-v0.9-APK
          path: build-src/jarvis/JarvisMVP/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
