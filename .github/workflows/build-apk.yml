
name: Build ORPHEUS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OrpheusUniversal_v0.8_Exact_ORPHEUS_Symbol.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract ORPHEUS
        run: |
          mkdir build-src
          unzip -q "OrpheusUniversal_v0.8_Exact_ORPHEUS_Symbol.zip" -d build-src

      - name: Build APK
        working-directory: build-src/jarvis/JarvisMVP
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORPHEUS-v0.8-APK
          path: build-src/jarvis/JarvisMVP/app/build/outputs/apk/debug/*.apk
